<svg xmlns="http://www.w3.org/2000/svg" viewBox="-5 -10 130 115" shape-rendering="crispEdges">
  <!-- Pi walker: the Powerline pi strolling right, eyes low on its thick top bar, clear of the badge corner (pi-cursor's column palette). Animated: "legL" and "legR" (step in turn; they run up under the bar, drawn last) and "bar" (dips as a foot lands) (MascotLoops). -->
