<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1 0 26 20" shape-rendering="crispEdges">
  <!-- Claude Code peekaboo: the pixel critter peeking up over a ledge, big eyes looking up, set low enough to stay clear of the badge. Animated: "lids" (hidden at rest; a blink), "pupils" (a glance) and "critter" (ducks behind the ledge, clipped at its top) (MascotLoops). -->
  <clipPath id="above"><rect x="-1" y="-1" width="26" height="19.5"/></clipPath>
  <g clip-path="url(#above)">
    <g id="critter">
      <path fill="#D97757" d="M3 3H21V18.5H3Z"/>
      <path fill="#FFFFFF" d="M4.5 7.5H10.5V13.5H4.5ZM13.5 7.5H19.5V13.5H13.5Z"/>
      <path id="pupils" fill="#2B1B14" d="M7.5 7.5H10.5V11H7.5ZM16.5 7.5H19.5V11H16.5Z"/>
      <path id="lids" fill="#D97757" opacity="0" d="M4.5 7.5H10.5V12H4.5ZM13.5 7.5H19.5V12H13.5Z"/>
    </g>
  </g>
  <path fill="#D97757" d="M0 13H4.5V15.5H0ZM19.5 13H24V15.5H19.5Z"/>
  <path fill="#A9533A" d="M0 15.5H24V18.5H0Z"/>
</svg>
